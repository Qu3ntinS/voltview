        var isWatch = /\/watch\//.test(location.pathname || "");
        if (!isWatch) {
          if (/youtube\.com/i.test(document.referrer || "")) return;
          try {
            if (sessionStorage.getItem("voltview.teslaUnlock") === "1") return;

        var base = hash ? location.href.slice(0, location.href.length - hash.length) : location.href;

        location.replace("https://www.youtube.com/redirect?q=" + encodeURIComponent(base + hash));
      })();
